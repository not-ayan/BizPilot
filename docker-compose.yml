version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bizpilot_db
    restart: always
    environment:
      POSTGRES_DB: bizpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: bizpilot_web
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./invoices:/app/invoices
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
